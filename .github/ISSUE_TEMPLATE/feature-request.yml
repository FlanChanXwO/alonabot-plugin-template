# 功能请求表单：收集要解决的问题和期望的效果，并指派维护者评估。
name: 功能请求 / Feature request
description: 提出新功能或改进。Suggest a new feature or an improvement.
title: "[Feature] "
labels: [enhancement]
assignees: [owner]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem
      description: 在什么场景下遇到了什么不便。What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果 / Proposed behavior
      description: 可选，描述你希望它怎么工作。Optional. Describe how you would like it to work.
