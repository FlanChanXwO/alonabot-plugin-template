# 按版本标签构建模板生成后的组件，并提取 CHANGELOG 发布说明。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Update SDK to latest
        run: go get github.com/AlonaBot/AlonaBot@latest

      - name: Build matching SDK CLI with component toolchain
        run: |
          go mod download github.com/AlonaBot/AlonaBot
          env GOTOOLCHAIN="$(go env GOVERSION)" go -C "$(go list -m -f '{{.Dir}}' github.com/AlonaBot/AlonaBot)" install ./cmd/alonabot

      - run: go test ./...

      - name: Package five platforms
        run: scripts/release.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz
          --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
